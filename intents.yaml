# Declarative voice command intent mappings

intents:
  # System Volume & Media
  - name: volume_up
    category: system
    triggers:
      - "volume up"
      - "turn up volume"
      - "increase volume"
      - "louder"
    action:
      type: system_action
      command: volume_step_up

  - name: volume_down
    category: system
    triggers:
      - "volume down"
      - "turn down volume"
      - "decrease volume"
      - "lower volume"
      - "softer"
    action:
      type: system_action
      command: volume_step_down

  - name: volume_mute
    category: system
    triggers:
      - "mute"
      - "mute volume"
      - "unmute"
      - "silence"
    action:
      type: system_action
      command: volume_toggle_mute

  - name: media_play_pause
    category: media
    triggers:
      - "play"
      - "pause"
      - "resume"
      - "play music"
      - "pause music"
    action:
      type: system_action
      command: media_play_pause

  - name: media_next
    category: media
    triggers:
      - "next track"
      - "next song"
      - "skip"
      - "skip song"
    action:
      type: system_action
      command: media_next

  - name: media_previous
    category: media
    triggers:
      - "previous track"
      - "previous song"
      - "restart song"
    action:
      type: system_action
      command: media_previous

  # Window Management
  - name: window_minimize
    category: window
    triggers:
      - "minimize"
      - "minimize window"
      - "hide window"
    action:
      type: system_action
      command: window_minimize_active

  - name: window_maximize
    category: window
    triggers:
      - "maximize"
      - "maximize window"
      - "fullscreen window"
    action:
      type: system_action
      command: window_maximize_active

  - name: window_restore
    category: window
    triggers:
      - "restore window"
      - "unmaximize"
    action:
      type: system_action
      command: window_restore_active

  - name: window_snap_left
    category: window
    triggers:
      - "snap left"
      - "tile left"
      - "window left"
    action:
      type: system_action
      command: window_snap_left

  - name: window_snap_right
    category: window
    triggers:
      - "snap right"
      - "tile right"
      - "window right"
    action:
      type: system_action
      command: window_snap_right

  - name: window_close
    category: window
    triggers:
      - "close window"
      - "close active window"
      - "close this"
    action:
      type: system_action
      command: window_close_active
    is_destructive: true

  # Application Launcher
  - name: launch_notepad
    category: app
    triggers:
      - "open notepad"
      - "launch notepad"
      - "start notepad"
    action:
      type: launch_app
      target: "notepad.exe"

  - name: launch_browser
    category: app
    triggers:
      - "open browser"
      - "launch browser"
      - "open chrome"
      - "launch chrome"
    action:
      type: launch_app
      target: "chrome.exe"
      fallback_target: "msedge.exe"

  - name: launch_terminal
    category: app
    triggers:
      - "open terminal"
      - "launch terminal"
      - "open powershell"
      - "launch powershell"
      - "open cmd"
    action:
      type: launch_app
      target: "wt.exe"
      fallback_target: "powershell.exe"

  - name: launch_calculator
    category: app
    triggers:
      - "open calculator"
      - "launch calculator"
      - "calc"
    action:
      type: launch_app
      target: "calc.exe"

  # System Power / Lock
  - name: lock_workstation
    category: system
    triggers:
      - "lock computer"
      - "lock pc"
      - "lock screen"
    action:
      type: system_action
      command: system_lock
    is_destructive: false

  # Key Presses
  - name: press_enter
    category: system
    triggers:
      - "press enter"
      - "hit enter"
      - "click enter"
      - "enter key"
    action:
      type: system_action
      command: key_enter

  - name: press_escape
    category: system
    triggers:
      - "press escape"
      - "hit escape"
      - "escape key"
    action:
      type: system_action
      command: key_escape

  - name: press_tab
    category: system
    triggers:
      - "press tab"
      - "hit tab"
      - "tab key"
    action:
      type: system_action
      command: key_tab

  - name: press_backspace
    category: system
    triggers:
      - "press backspace"
      - "hit backspace"
      - "backspace"
    action:
      type: system_action
      command: key_backspace

  - name: press_delete
    category: system
    triggers:
      - "press delete"
      - "hit delete"
      - "delete key"
    action:
      type: system_action
      command: key_delete

  - name: press_page_down
    category: system
    triggers:
      - "page down"
      - "scroll down page"
    action:
      type: system_action
      command: key_page_down

  - name: press_page_up
    category: system
    triggers:
      - "page up"
      - "scroll up page"
    action:
      type: system_action
      command: key_page_up

  # Keyboard shortcuts: Jev maps paraphrases and misheard words onto these
  - name: new_tab
    category: hotkey
    triggers:
      - "new tab"
      - "open new tab"
      - "open a new tab"
    action:
      type: hotkey
      keys: ["ctrl", "t"]
  - name: close_tab
    category: hotkey
    triggers:
      - "close tab"
      - "close this tab"
      - "close the tab"
    action:
      type: hotkey
      keys: ["ctrl", "w"]
  - name: reopen_tab
    category: hotkey
    triggers:
      - "reopen tab"
      - "reopen closed tab"
      - "restore tab"
    action:
      type: hotkey
      keys: ["ctrl", "shift", "t"]
  - name: next_tab
    category: hotkey
    triggers:
      - "next tab"
      - "switch tab"
      - "tab right"
    action:
      type: hotkey
      keys: ["ctrl", "tab"]
  - name: previous_tab
    category: hotkey
    triggers:
      - "previous tab"
      - "last tab"
      - "tab left"
    action:
      type: hotkey
      keys: ["ctrl", "shift", "tab"]
  - name: new_window
    category: hotkey
    triggers:
      - "new window"
      - "open new window"
    action:
      type: hotkey
      keys: ["ctrl", "n"]
  - name: incognito_window
    category: hotkey
    triggers:
      - "incognito"
      - "new incognito window"
      - "private window"
    action:
      type: hotkey
      keys: ["ctrl", "shift", "n"]
  - name: refresh_page
    category: hotkey
    triggers:
      - "refresh"
      - "reload"
      - "refresh page"
      - "reload page"
    action:
      type: hotkey
      keys: ["f5"]
  - name: go_back
    category: hotkey
    triggers:
      - "go back"
      - "previous page"
    action:
      type: hotkey
      keys: ["alt", "left"]
  - name: go_forward
    category: hotkey
    triggers:
      - "go forward"
      - "next page"
    action:
      type: hotkey
      keys: ["alt", "right"]
  - name: address_bar
    category: hotkey
    triggers:
      - "address bar"
      - "focus address bar"
      - "go to address bar"
    action:
      type: hotkey
      keys: ["ctrl", "l"]
  - name: bookmark_page
    category: hotkey
    triggers:
      - "bookmark this"
      - "bookmark page"
    action:
      type: hotkey
      keys: ["ctrl", "d"]
  - name: show_history
    category: hotkey
    triggers:
      - "show history"
      - "open history"
      - "browser history"
    action:
      type: hotkey
      keys: ["ctrl", "h"]
  - name: show_downloads
    category: hotkey
    triggers:
      - "show downloads"
      - "open downloads"
    action:
      type: hotkey
      keys: ["ctrl", "j"]
  - name: zoom_in
    category: hotkey
    triggers:
      - "zoom in"
      - "make it bigger"
      - "bigger text"
    action:
      type: hotkey
      keys: ["ctrl", "="]
  - name: zoom_out
    category: hotkey
    triggers:
      - "zoom out"
      - "make it smaller"
      - "smaller text"
    action:
      type: hotkey
      keys: ["ctrl", "-"]
  - name: zoom_reset
    category: hotkey
    triggers:
      - "reset zoom"
      - "actual size"
    action:
      type: hotkey
      keys: ["ctrl", "0"]
  - name: fullscreen
    category: hotkey
    triggers:
      - "full screen"
      - "toggle full screen"
      - "fullscreen"
    action:
      type: hotkey
      keys: ["f11"]
  - name: copy
    category: hotkey
    triggers:
      - "copy"
      - "copy that"
      - "copy this"
    action:
      type: hotkey
      keys: ["ctrl", "c"]
  - name: cut
    category: hotkey
    triggers:
      - "cut"
      - "cut that"
    action:
      type: hotkey
      keys: ["ctrl", "x"]
  - name: paste
    category: hotkey
    triggers:
      - "paste"
      - "paste it"
      - "paste that"
    action:
      type: hotkey
      keys: ["ctrl", "v"]
  - name: undo
    category: hotkey
    triggers:
      - "undo"
      - "undo that"
    action:
      type: hotkey
      keys: ["ctrl", "z"]
  - name: redo
    category: hotkey
    triggers:
      - "redo"
      - "redo that"
    action:
      type: hotkey
      keys: ["ctrl", "y"]
  - name: select_all
    category: hotkey
    triggers:
      - "select all"
      - "select everything"
      - "select all text"
    action:
      type: hotkey
      keys: ["ctrl", "a"]
  - name: save
    category: hotkey
    triggers:
      - "save"
      - "save file"
      - "save this"
    action:
      type: hotkey
      keys: ["ctrl", "s"]
  - name: find
    category: hotkey
    triggers:
      - "find"
      - "find on page"
      - "search this page"
    action:
      type: hotkey
      keys: ["ctrl", "f"]
  - name: print
    category: hotkey
    triggers:
      - "print"
      - "print this"
    action:
      type: hotkey
      keys: ["ctrl", "p"]
  - name: bold
    category: hotkey
    triggers:
      - "bold"
      - "make it bold"
    action:
      type: hotkey
      keys: ["ctrl", "b"]
  - name: italic
    category: hotkey
    triggers:
      - "italic"
      - "make it italic"
    action:
      type: hotkey
      keys: ["ctrl", "i"]
  - name: underline
    category: hotkey
    triggers:
      - "underline"
    action:
      type: hotkey
      keys: ["ctrl", "u"]
  - name: scroll_top
    category: hotkey
    triggers:
      - "go to top"
      - "scroll to top"
      - "top of page"
    action:
      type: hotkey
      keys: ["ctrl", "home"]
  - name: scroll_bottom
    category: hotkey
    triggers:
      - "go to bottom"
      - "scroll to bottom"
      - "bottom of page"
    action:
      type: hotkey
      keys: ["ctrl", "end"]
  - name: scroll_down
    category: hotkey
    triggers:
      - "scroll down"
    action:
      type: hotkey
      keys: ["pagedown"]
  - name: scroll_up
    category: hotkey
    triggers:
      - "scroll up"
    action:
      type: hotkey
      keys: ["pageup"]
  - name: switch_window
    category: hotkey
    triggers:
      - "switch window"
      - "switch app"
      - "alt tab"
      - "previous window"
    action:
      type: hotkey
      keys: ["alt", "tab"]
  - name: show_desktop
    category: hotkey
    triggers:
      - "show desktop"
      - "hide all windows"
      - "minimize all"
    action:
      type: hotkey
      keys: ["win", "d"]
  - name: task_view
    category: hotkey
    triggers:
      - "task view"
      - "show all windows"
    action:
      type: hotkey
      keys: ["win", "tab"]
  - name: file_explorer
    category: hotkey
    triggers:
      - "open file explorer"
      - "open explorer"
      - "open my files"
    action:
      type: hotkey
      keys: ["win", "e"]
  - name: windows_settings
    category: hotkey
    triggers:
      - "open settings"
      - "windows settings"
    action:
      type: hotkey
      keys: ["win", "i"]
  - name: start_menu
    category: hotkey
    triggers:
      - "open start menu"
      - "start menu"
    action:
      type: hotkey
      keys: ["win"]
  - name: windows_search
    category: hotkey
    triggers:
      - "windows search"
      - "open search"
    action:
      type: hotkey
      keys: ["win", "s"]
  - name: screenshot
    category: hotkey
    triggers:
      - "take screenshot"
      - "screenshot"
      - "snip"
    action:
      type: hotkey
      keys: ["win", "shift", "s"]
  - name: clipboard_history
    category: hotkey
    triggers:
      - "clipboard history"
      - "show clipboard"
    action:
      type: hotkey
      keys: ["win", "v"]
  - name: emoji_panel
    category: hotkey
    triggers:
      - "emoji"
      - "open emoji"
    action:
      type: hotkey
      keys: ["win", "."]
  - name: task_manager
    category: hotkey
    triggers:
      - "task manager"
      - "open task manager"
    action:
      type: hotkey
      keys: ["ctrl", "shift", "esc"]
  - name: new_virtual_desktop
    category: hotkey
    triggers:
      - "new desktop"
      - "new virtual desktop"
    action:
      type: hotkey
      keys: ["win", "ctrl", "d"]
  - name: next_desktop
    category: hotkey
    triggers:
      - "next desktop"
    action:
      type: hotkey
      keys: ["win", "ctrl", "right"]
  - name: previous_desktop
    category: hotkey
    triggers:
      - "previous desktop"
    action:
      type: hotkey
      keys: ["win", "ctrl", "left"]
  - name: notifications
    category: hotkey
    triggers:
      - "notifications"
      - "show notifications"
    action:
      type: hotkey
      keys: ["win", "n"]
  - name: quick_settings
    category: hotkey
    triggers:
      - "quick settings"
      - "action center"
    action:
      type: hotkey
      keys: ["win", "a"]
